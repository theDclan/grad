<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>The Scholar and the Next Chapter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --black:#08060A; --pink:#B76E79; --pink-soft:#E8B4BC; --pink-deep:#6E3A44; --white:#FFF5F6;
  --serif:"Bodoni Moda","Didot","Times New Roman",serif;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;line-height:1.6;overflow-x:hidden}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--black);z-index:60}

/* latar */
.blob{position:fixed;border-radius:50%;opacity:.55;z-index:0;pointer-events:none}
.b1{width:55vmax;height:55vmax;left:-20vmax;top:-18vmax;background:radial-gradient(circle,var(--pink-deep),transparent 70%);animation:drift1 18s ease-in-out infinite alternate}
.b2{width:50vmax;height:50vmax;right:-22vmax;bottom:-20vmax;background:radial-gradient(circle,var(--pink),transparent 70%);opacity:.35;animation:drift2 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vmax,-12vmax) scale(.9)}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(8,6,10,.85))}

/* intro */
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;transition:opacity 1s ease,visibility 1s}
.intro.gone{opacity:0;visibility:hidden}
.open-btn{background:none;border:0;color:var(--white);cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:28px}
.ring{width:96px;height:96px;border-radius:50%;border:1px solid var(--pink);display:grid;place-items:center;box-shadow:0 0 30px rgba(183,110,121,.5),inset 0 0 24px rgba(183,110,121,.35);animation:pulse 2.4s ease-in-out infinite}
.ring svg{width:34px;height:34px;fill:var(--pink);filter:drop-shadow(0 0 8px var(--pink))}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 54px rgba(183,110,121,.8),inset 0 0 30px rgba(183,110,121,.5)}}
.open-btn:focus-visible .ring{outline:2px solid var(--white);outline-offset:6px}
.intro h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(1.6rem,6vw,2.4rem);margin:0}
.intro small{display:block;color:var(--pink-soft);margin-top:6px;font-size:.95rem}

/* kalimat pembuka */
.line{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;opacity:0;pointer-events:none;
  font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,5.8vw,2.7rem);line-height:1.3;text-shadow:0 0 30px rgba(183,110,121,.6)}
.line.show{animation:lineIn 2.3s ease both}
@keyframes lineIn{0%{opacity:0;filter:blur(12px);transform:scale(.95)}25%,75%{opacity:1;filter:blur(0);transform:none}100%{opacity:0;filter:blur(10px);transform:scale(1.03)}}

/* konten */
main{position:relative;z-index:5;max-width:660px;margin:0 auto;padding:0 24px 80px;visibility:hidden}
main.on{visibility:visible}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0}
.cap{width:150px;opacity:0;margin-bottom:10px;filter:drop-shadow(0 0 18px rgba(183,110,121,.7))}
.on .cap{animation:land 1.6s cubic-bezier(.2,.8,.3,1) .1s forwards,bob 4s ease-in-out 1.7s infinite}
@keyframes land{0%{opacity:0;transform:translateY(-260px) rotate(-200deg)}100%{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.hero h2{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,8.5vw,3.4rem);line-height:1.1;margin:12px 0 4px;letter-spacing:-.01em;text-shadow:0 0 40px rgba(183,110,121,.45)}
.name{display:block;font-weight:500;font-style:italic;color:var(--pink);font-size:clamp(2.4rem,11vw,4.2rem);margin-top:8px;text-shadow:0 0 12px rgba(183,110,121,.9),0 0 46px rgba(183,110,121,.7)}
.hero p{max-width:32ch;margin:18px 0 0;color:var(--pink-soft);font-size:1.1rem}
.scroll{margin-top:40px;color:var(--pink-soft);font-size:.9rem;opacity:0}
.on .scroll{animation:fadeIn 1s ease 3.2s forwards}
.scroll::after{content:"";display:block;width:1px;height:46px;margin:10px auto 0;background:linear-gradient(var(--pink),transparent);animation:slide 1.8s ease-in-out infinite}
@keyframes fadeIn{to{opacity:1}}
@keyframes slide{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

.letter{background:rgba(30,16,20,.72);border:1px solid rgba(183,110,121,.4);border-radius:20px;padding:36px 28px;box-shadow:0 0 60px rgba(183,110,121,.14),inset 0 0 40px rgba(183,110,121,.05)}
.letter h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.8rem;line-height:1.25;margin:0 0 20px}
.letter p{margin:0 0 18px;font-size:1.12rem;line-height:1.8;max-width:58ch}
.sign{margin-top:30px;font-family:var(--serif);font-style:italic;font-size:1.25rem}
.sign small{display:block;font-family:var(--sans);font-style:normal;color:var(--pink-soft);font-size:.92rem;margin-top:6px}
.replay{display:block;margin:34px auto 0;background:none;border:1px solid var(--pink);color:var(--white);padding:12px 26px;border-radius:99px;font:inherit;cursor:pointer;box-shadow:0 0 22px rgba(183,110,121,.35)}
.replay:hover{background:rgba(183,110,121,.18)}
.replay:focus-visible{outline:2px solid var(--white);outline-offset:4px}

@media (prefers-reduced-motion:reduce){
  .blob,.ring,.on .cap,.scroll::after{animation:none}
  .on .cap{opacity:1}
  .line.show{animation:none;opacity:1}
}
</style>
</head>
<body class="locked">
<div class="blob b1"></div><div class="blob b2"></div>
<canvas id="bg"></canvas>
<div class="vignette"></div>

<div class="intro" id="intro">
  <button class="open-btn" id="open" aria-label="Buka kejutan">
    <span class="ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.7 4.5 6.3 4.5c2 0 3.9 1 5.7 3.2 1.8-2.2 3.7-3.2 5.7-3.2 3.6 0 5.5 3.8 3.9 7.3C19.5 16.4 12 21 12 21z"/></svg></span>
    <span><h1>for you</h1><small>Ketuk untuk membuka</small></span>
  </button>
</div>
<div class="line" id="line" aria-live="polite"></div>

<main id="main">
  <section class="hero">
    <svg class="cap" viewBox="0 0 190 130" aria-hidden="true">
      <path d="M45 62v34c0 14 22 26 50 26s50-12 50-26V62L95 80z" fill="#6E3A44"/>
      <path d="M95 14 6 50l89 36 89-36z" fill="#120A14" stroke="#B76E79" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="95" cy="50" r="5" fill="#B76E79"/>
      <path d="M95 50 168 60v38" fill="none" stroke="#B76E79" stroke-width="3" stroke-linecap="round"/>
      <path d="M162 98h12l-2 22h-8z" fill="#B76E79"/>
    </svg>
    <h2>A toast for your Big day, darling<span class="name" id="nama">Sayang</span></h2>
    <p id="sub"></p>
    <div class="scroll">the 2nd letter for you</div>
  </section>

  <article class="letter" id="letter">
    <h3 id="salam"></h3>
    <div id="pesan"></div>
    <div class="sign"><span id="penutup"></span><small id="pengirim"></small></div>
  </article>
  <button class="replay" id="replay">Lihat kembang apinya lagi</button>
</main>

<script>
// ====== UBAH BAGIAN INI ======
const CONFIG = {
  nama: "Minii S.Kep",
  sub: "udah capek bukan berati ngga layak di rayain, let me rejoice in it",
  pembuka: ["Hari ini, hari mu", "dibalik pencapaian hari ini ngga kehitung pengorbanan jam tidur, air mata, lelah, dan senengmu", "yet here you are, standing proud with that graduation gown"],
  pengirim: "— your best gift of the year",
  salam: "for you, who have been achieved this far",
  pesan: [
    "aku tau gimana kamu begadang ngerjain tugas, revisian sampe bener bener cape. untuk itu biarin aku ngerayain kemenanganmu.",
    "Gelar itu emang punyamu, tapi izinin aku ikut bahagia sebesar besarnya dan aku bangga banget sama kamu"
  ],
  penutup: "akhir dari studi eskep namun awal dengan gelar eskep, The best part is i’ve back at the right time in one of your life check point and im gratefull being here with you"
};
// =============================

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
$("nama").textContent = CONFIG.nama; $("sub").textContent = CONFIG.sub;
$("salam").textContent = CONFIG.salam; $("penutup").textContent = CONFIG.penutup; $("pengirim").textContent = CONFIG.pengirim;
CONFIG.pesan.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("pesan").appendChild(p); });

/* kanvas: bokeh + kembang api */
const cv = $("bg"), ctx = cv.getContext("2d");
let W, H, DPR, mx = 0, my = 0, tx = 0, ty = 0;
const pinks = ["183,110,121", "214,150,160", "232,190,198", "255,255,255"];
const bokeh = [], sparks = [];
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize(); addEventListener("resize", resize);
for (let i = 0; i < 24; i++) bokeh.push({
  x: Math.random(), y: Math.random(), r: 6 + Math.random() * 34, d: .2 + Math.random() * .8,
  vy: -(.00004 + Math.random() * .00012), vx: (Math.random() - .5) * .00006,
  a: .12 + Math.random() * .3, c: pinks[Math.random() < .8 ? (Math.random() * 3 | 0) : 3], ph: Math.random() * 6.28
});
addEventListener("pointermove", e => { tx = (e.clientX / W - .5); ty = (e.clientY / H - .5); });

function burst(x, y) {
  const n = 60, c = pinks[Math.random() * 3 | 0];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 1.2 + Math.random() * 4.4;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 80 + Math.random() * 60, c: Math.random() < .25 ? "255,255,255" : c, sz: 1.2 + Math.random() * 2 });
  }
}
let t0 = 0;
function frame(t) {
  mx += (tx - mx) * .04; my += (ty - my) * .04;
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  for (const b of bokeh) {
    b.y += b.vy * 16; b.x += b.vx * 16;
    if (b.y < -.1) { b.y = 1.1; b.x = Math.random(); }
    const px = b.x * W - mx * 60 * b.d, py = b.y * H - my * 60 * b.d;
    const al = b.a * (.65 + .35 * Math.sin(t / 1400 + b.ph));
    const g = ctx.createRadialGradient(px, py, 0, px, py, b.r);
    g.addColorStop(0, `rgba(${b.c},${al})`); g.addColorStop(.6, `rgba(${b.c},${al * .35})`); g.addColorStop(1, `rgba(${b.c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, b.r, 0, 6.283); ctx.fill();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.life++; p.vx *= .98; p.vy = p.vy * .98 + .045; p.x += p.vx; p.y += p.vy;
    if (p.life > p.max) { sparks.splice(i, 1); continue; }
    const al = 1 - p.life / p.max;
    ctx.fillStyle = `rgba(${p.c},${al})`; 
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * (.5 + al), 0, 6.283); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function fireworks() {
  if (reduce) { burst(W / 2, H * .35); return; }
  [[.5,.3],[.25,.42],[.75,.38],[.4,.2],[.65,.25],[.15,.25],[.85,.22],[.5,.4]].forEach(([x, y], i) =>
    setTimeout(() => burst(x * W, y * H), i * 380));
}

/* alur */
function showMain() {
  $("main").classList.add("on"); document.body.classList.remove("locked");
  scrollTo(0, 0); fireworks();
}
function playLines(i) {
  if (i >= CONFIG.pembuka.length) { $("line").classList.remove("show"); return showMain(); }
  const l = $("line"); l.classList.remove("show"); void l.offsetWidth;
  const txt = CONFIG.pembuka[i], dur = Math.max(2300, 1300 + txt.length * 55);
  l.textContent = txt; l.style.animationDuration = dur + "ms"; l.classList.add("show");
  setTimeout(() => playLines(i + 1), reduce ? 1400 + txt.length * 30 : dur);
}
$("open").addEventListener("click", () => {
  $("intro").classList.add("gone");
  setTimeout(() => playLines(0), reduce ? 0 : 700);
}, { once: true });
$("replay").addEventListener("click", () => { scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); setTimeout(fireworks, reduce ? 0 : 600); });
</script>
</body>
</html>
